services:
  falkordb:
    image: falkordb/falkordb:v4.22.1
    # Loopback only: FalkorDB has no password here, and Docker's published ports bypass host firewalls.
    ports:
      - "127.0.0.1:6380:6379"
      - "127.0.0.1:3001:3000"
    volumes:
      - falkordb-data:/var/lib/falkordb/data
volumes:
  falkordb-data:
