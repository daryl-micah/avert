app = "avert-demo"
primary_region = "sin"

[build]

[env]
  PORT = "8080"
  AVERT_PUBLIC_GRAPHS = "avert:acme,avert:flutter-stripe__flutter_stripe,avert:whapi-cloud__python-whatsapp-chatbot,avert:kentemman__messengergpt,avert:alonlavian__ragent"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
