name: Build and deploy

# Image goes to public GHCR (no registry secret). Azure access is OIDC federation: no stored credential.
# One-time setup: make the ghcr.io/daryl-micah/avert package public, and set repo variables
# AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, AZURE_RESOURCE_GROUP, AZURE_CONTAINER_APP.
on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ghcr.io/daryl-micah/avert:${{ github.sha }}
            ghcr.io/daryl-micah/avert:latest
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: >
          az containerapp update
          --name ${{ vars.AZURE_CONTAINER_APP }}
          --resource-group ${{ vars.AZURE_RESOURCE_GROUP }}
          --image ghcr.io/daryl-micah/avert:${{ github.sha }}
